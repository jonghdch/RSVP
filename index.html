<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSVP 리더</title>
  <meta name="description" content="글을 붙여넣으면 한 단어씩 빠르게 보여 주는 읽기 도구">
  <script>
    // 고른 화면 모드를 그리기 전에 적용해 새로고침 때 반대 색이 깜빡이지 않게 한다
    try {
      const theme = localStorage.getItem('rsvp-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <h1 class="title">RSVP 리더</h1>
      <button type="button" class="theme-btn" id="btn-theme" aria-label="다크 모드로 바꾸기" title="다크 모드로 바꾸기">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <section class="reader" id="reader" aria-label="읽기 화면">
      <div class="stage-wrap" id="stage-wrap">
        <button type="button" class="stage" id="stage" disabled>
          <span class="word" id="word" aria-hidden="true"><span class="word-before"></span><span class="word-pivot"></span><span class="word-after"></span></span>
          <span class="stage-message" id="stage-message">아래에 글을 붙여넣으세요</span>
        </button>
        <p class="stage-heading" id="stage-heading"></p>
        <button type="button" class="fullscreen-btn" id="btn-fullscreen" aria-label="전체 화면" title="전체 화면" disabled>
          <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        </button>
      </div>
      <p class="visually-hidden" id="announce" aria-live="polite"></p>

      <input type="range" class="range progress" id="progress" min="0" max="0" value="0" step="1" aria-label="읽은 위치" disabled>
      <div class="paragraph-marks" id="paragraph-marks" hidden></div>
      <p class="status" id="status">0 / 0 단어</p>

      <div class="controls">
        <button type="button" class="btn" id="btn-prev-paragraph" aria-label="이전 문단" disabled><span class="arrow">◀</span> <span class="btn-long">한 </span>문단</button>
        <button type="button" class="btn" id="btn-prev-sentence" aria-label="이전 문장" disabled><span class="arrow">◀</span> <span class="btn-long">한 </span>문장</button>
        <button type="button" class="btn" id="btn-prev" aria-label="이전 단어" disabled><span class="arrow">◀</span> <span class="btn-long">한 </span>단어</button>
        <button type="button" class="btn btn-primary btn-icon" id="btn-play" aria-label="재생" title="재생" data-mode="play" disabled>
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
          <svg class="icon-restart" viewBox="0 0 24 24" aria-hidden="true"><path class="stroke" d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4h4"/></svg>
        </button>
        <button type="button" class="btn" id="btn-next" aria-label="다음 단어" disabled><span class="btn-long">한 </span>단어 <span class="arrow">▶</span></button>
        <button type="button" class="btn" id="btn-next-sentence" aria-label="다음 문장" disabled><span class="btn-long">한 </span>문장 <span class="arrow">▶</span></button>
        <button type="button" class="btn" id="btn-next-paragraph" aria-label="다음 문단" disabled><span class="btn-long">한 </span>문단 <span class="arrow">▶</span></button>
      </div>

      <label class="speed">
        <span class="speed-label">속도</span>
        <input type="range" class="range" id="speed" min="100" max="1000" step="25" value="300" aria-label="읽기 속도(분당 단어 수)">
        <output id="speed-value" for="speed">300 WPM</output>
      </label>
    </section>

    <section class="source">
      <label class="source-label" for="source">읽을 글</label>
      <textarea id="source" rows="10" placeholder="여기에 글을 붙여넣으세요" spellcheck="false"></textarea>
      <p class="shortcuts">단축키(입력칸 밖에서): <kbd>Space</kbd> 재생·정지 · <kbd>F</kbd> 전체 화면 · <kbd>0</kbd> 처음으로 · <kbd>←</kbd><kbd>→</kbd> 단어 · <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> 문장 · <kbd>PgUp</kbd><kbd>PgDn</kbd> 문단 · <kbd>↑</kbd><kbd>↓</kbd> 속도</p>
    </section>
  </main>
</body>
</html>
